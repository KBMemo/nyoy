<% db_credentials = Rails.application.credentials.database %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "bowmore.artif.org") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME") { db_credentials&.username } %>
  password: <%= ENV.fetch("DB_PASSWORD") { db_credentials&.password } %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "nyoy_development") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_QUEUE_NAME", "nyoy_development_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_CABLE_NAME", "nyoy_development_cable") %>
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "nyoy_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "nyoy_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_CACHE_NAME", "nyoy_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_QUEUE_NAME", "nyoy_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_CABLE_NAME", "nyoy_production_cable") %>
    migrations_paths: db/cable_migrate
